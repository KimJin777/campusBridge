<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>캠퍼스 브릿지</title>
  <meta name="description" content="휴학, 장학금, 수강신청… 선배한테 묻듯 편하게 물어보세요. 학칙·학사공지·학사일정 근거와 담당 부서 연락처까지 안내합니다.">
  <!-- 링크 미리보기(카카오톡·페이스북 등 OG, X는 twitter 카드). 이미지는 절대 주소 필수 -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="캠퍼스 브릿지">
  <meta property="og:title" content="캠퍼스 브릿지 — 경남대 학사 도우미">
  <meta property="og:description" content="휴학, 장학금, 수강신청… 선배한테 묻듯 편하게 물어보세요. 학교 공식 자료로 답해 드려요.">
  <meta property="og:url" content="https://campusbridge-web-o3jnh7zl4a-du.a.run.app/">
  <meta property="og:image" content="https://campusbridge-web-o3jnh7zl4a-du.a.run.app/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="캠퍼스 브릿지 — 휴학, 장학금, 수강신청… 선배한테 묻듯 편하게 물어보세요.">
  <meta property="og:locale" content="ko_KR">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="top">
    <div class="brand-wrap">
      <img src="logo.svg" alt="" class="logo" width="32" height="32">
      <h1 class="brand">캠퍼스 브릿지</h1>
      <span class="version-pill" id="version">학사 어시스턴트</span>
    </div>
    <button type="button" id="new-thread" class="btn-primary small" aria-label="새 대화 시작">
      <span class="ico" data-icon="chat"></span>새 대화 시작
    </button>
  </header>

  <main id="chat" class="chat" aria-live="polite">
    <section id="welcome" class="welcome">
      <p class="status-pill"><span class="dot"></span>학칙·학사안내 색인 · 공지·학사일정 실시간 조회</p>
      <h2 class="hero">휴학, 장학금, 수강신청…<br><span class="hl">선배한테 묻듯</span> 편하게 물어보세요.</h2>
      <ul class="features">
        <li><span class="ico" data-icon="check"></span>출처 원문 근거 표기</li>
        <li><span class="ico" data-icon="bolt"></span>실시간 학사공지 연동</li>
        <li><span class="ico" data-icon="phone"></span>담당 부서 연결</li>
      </ul>
      <section id="today" class="today" hidden aria-labelledby="today-title">
        <p class="chips-label" id="today-title"><span class="ico" data-icon="calendar"></span>오늘·이번 주 학사 일정</p>
        <ul id="today-list" class="today-list"></ul>
      </section>
      <p class="chips-label"><span class="ico" data-icon="help"></span>자주 묻는 학사 질문</p>
      <div id="chips" class="chips" role="list"></div>
    </section>
    <ol id="turns" class="turns"></ol>
  </main>

  <footer class="dock">
    <div class="dock-inner">
      <form id="form" class="input-row" autocomplete="off">
        <label for="input" class="sr-only">질문</label>
        <textarea id="input" rows="1" maxlength="500" placeholder="질문을 입력하세요 (예: 이번 학기 수강 정정 언제까지인가요?)" required></textarea>
        <button type="submit" id="send" class="btn-primary" aria-label="전송">전송 <span class="ico" data-icon="up"></span></button>
      </form>
      <p class="privacy-note"><span class="ico" data-icon="info"></span>학번·성명·전화번호 등 개인정보를 입력하지 마세요. <a href="privacy.html">개인정보 처리방침</a></p>
      <p class="site-foot"><strong>캠퍼스 브릿지 (Campus Bridge)</strong> · 공식 학칙·학사공지 근거 기반 AI 안내 <span class="version" id="version-foot"></span></p>
    </div>
  </footer>

  <template id="tpl-turn">
    <li class="turn">
      <div class="user-row"><div class="bubble user"></div></div>
      <div class="bot-row">
        <span class="avatar" aria-hidden="true"><span class="ico" data-icon="bot"></span></span>
        <div class="bot">
          <details class="timeline" open>
            <summary><span class="ico" data-icon="spark"></span>판단 과정</summary>
            <ol class="steps"></ol>
          </details>
          <div class="answer" tabindex="-1"></div>
          <section class="evidence-wrap" hidden>
            <div class="evidence-head">
              <span><span class="ico" data-icon="book"></span>공식 근거 자료</span>
              <button type="button" class="more-cards link" hidden>검색 후보 더 보기</button>
            </div>
            <div class="cards" role="list"></div>
          </section>
          <div class="dept-slot"></div>
          <div class="feedback" hidden>
            <button type="button" class="fb up" aria-label="도움이 됐어요"><span class="ico" data-icon="thumbup"></span>도움이 됐어요</button>
            <button type="button" class="fb down" aria-label="아쉬워요"><span class="ico" data-icon="thumbdown"></span>아쉬워요</button>
            <span class="fb-state"></span>
          </div>
        </div>
      </div>
    </li>
  </template>
</body>
</html>
