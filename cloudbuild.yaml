# campusBridge 웹 배포(상세설계 07 §3·§4·§6). MatchProf 방식: 환경 종속 값은 전부 substitutions.
# 실행: gcloud builds submit --config cloudbuild.yaml
#   --substitutions=_ADMIN_EMAILS=a@kyungnam.ac.kr|b@kyungnam.ac.kr  (버전은 backend/app/version.py)
# ⚠️ Cloud Run 공개(allow-unauthenticated)는 외부 공개 — 교수님 승인 후 실행한다.
substitutions:
  _REGION: asia-northeast3
  _SERVICE_NAME: campusbridge-web
  _REPO_NAME: campusbridge
  _SA_NAME: web-sa
  _BUCKET_NAME: campusbridge-510101-rules
  _FIRESTORE_DB: campusbridge
  _DATASTORE_ID: rules-articles
  _SERVING_CONFIG: rules-articles-search  # 엔진 ID만 주면 도구가 전체 경로를 조립
  _GEMINI_LOCATION: global
  _GEMINI_MODEL: gemini-3.5-flash
  _GEMINI_FALLBACK_MODEL: gemini-3.5-flash-lite
  _OAUTH_CLIENT_ID: 171234524211-4clnkts6hg4se3vppq6mdd4f34oo4mgc.apps.googleusercontent.com
  # 관리자 이메일은 저장소(공개 예정)에 두지 않는다 — 트리거 대체 변수나 --substitutions로 전달
  _ADMIN_EMAILS: ""
  _INGESTION_JOB_NAME: campusbridge-ingest
  _INGEST_SA_NAME: ingest-sa
  # 수집 요청의 식별 UA 연락처(저장소 공개 대비 기본값 비움 — 실행 시 전달)
  _CONTACT_EMAIL: ""
  _MIN_INSTANCES: "1"

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - id: test
    name: python:3.12-slim
    entrypoint: sh
    args:
      - -c
      - pip install -q uv && uv sync --frozen --all-extras && uv run ruff check backend && uv run pytest -q

  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - Dockerfile.web
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/web:$BUILD_ID
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args: [push, "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/web:$BUILD_ID"]

  - id: build-ingest
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - Dockerfile.ingest
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/ingest:$BUILD_ID
      - .

  - id: push-ingest
    name: gcr.io/cloud-builders/docker
    args: [push, "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/ingest:$BUILD_ID"]

  - id: deploy-ingest-job
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - jobs
      - deploy
      - ${_INGESTION_JOB_NAME}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/ingest:$BUILD_ID
      - --region=${_REGION}
      - --service-account=${_INGEST_SA_NAME}@$PROJECT_ID.iam.gserviceaccount.com
      - --cpu=1
      - --memory=2Gi
      - --task-timeout=3600
      - --max-retries=0
      - >-
        --set-env-vars=^;^GCP_PROJECT_ID=$PROJECT_ID;GOOGLE_CLOUD_PROJECT=$PROJECT_ID;FIRESTORE_DB=${_FIRESTORE_DB};RULES_BUCKET=${_BUCKET_NAME};SEARCH_DATASTORE_ID=${_DATASTORE_ID};SEARCH_ENGINE_ID=${_SERVING_CONFIG};COLLECTION_CONTACT_EMAIL=${_CONTACT_EMAIL}

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/web:$BUILD_ID
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --service-account=${_SA_NAME}@$PROJECT_ID.iam.gserviceaccount.com
      - --cpu=1
      - --memory=1Gi
      - --cpu-boost
      - --concurrency=8
      - --min-instances=${_MIN_INSTANCES}
      - --max-instances=3
      - --timeout=300
      - --port=8080
      # ADMIN_EMAILS에 쉼표가 있어 구분자를 ;로 바꾼다(^;^)
      - >-
        --set-env-vars=^;^GCP_PROJECT_ID=$PROJECT_ID;GOOGLE_CLOUD_PROJECT=$PROJECT_ID;FIRESTORE_DB=${_FIRESTORE_DB};RULES_BUCKET=${_BUCKET_NAME};SEARCH_LOCATION=global;SEARCH_DATASTORE_ID=${_DATASTORE_ID};SEARCH_SERVING_CONFIG=${_SERVING_CONFIG};GEMINI_LOCATION=${_GEMINI_LOCATION};GEMINI_MODEL=${_GEMINI_MODEL};GEMINI_FALLBACK_MODEL=${_GEMINI_FALLBACK_MODEL};GOOGLE_OAUTH_CLIENT_ID=${_OAUTH_CLIENT_ID};ADMIN_EMAILS=${_ADMIN_EMAILS};INGESTION_JOB_NAME=${_INGESTION_JOB_NAME}

  - id: smoke
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        URL=$(gcloud run services describe ${_SERVICE_NAME} --region=${_REGION} --format='value(status.url)')
        bash scripts/smoke.sh "$$URL"

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/web:$BUILD_ID
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/ingest:$BUILD_ID
