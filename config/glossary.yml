version: 1

# Only reviewed aliases belong here. Runtime learning must never update this file.
approved_aliases: {}

# High-impact terms that must be confirmed instead of automatically replaced.
protected_confusions:
  - ["휴학", "퇴학"]
  - ["복학", "재입학"]
  - ["제적", "자퇴"]

# 경남대에만 있는 말(교수님 #767). 질문에 나오면 뜻을 참고로 알려 준다(인용 근거는 아님).
# 관리자 화면 [용어 사전]에서 더하거나 고치면 Firestore glossary_terms가 우선한다.
campus_terms:
  - term: 너른마당
    aliases: ["너른 마당"]
    meaning: "제1경영관 아래, 제1경영관과 창조관 사이의 광장. 스쿨버스(통학버스)를 타고 내리는 곳"
  - term: 월영지
    aliases: []
    meaning: "캠퍼스 안 연못으로 캠퍼스투어 명소. 정문 안쪽 한마상·10.18광장 근처"
  - term: 10.18광장
    aliases: ["1018광장", "시월십팔광장"]
    meaning: "정문 안쪽 광장(캠퍼스투어 명소), 한마상·월영지 근처"
  - term: 한마상
    aliases: []
    meaning: "정문 안쪽에 있는 경남대 상징 조형물(캠퍼스투어 명소)"

